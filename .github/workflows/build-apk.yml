name: Build APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Make Gradle executable
      run: chmod +x ./gradlew

    - name: Build with Gradle
      run: ./gradlew assembleRelease
      continue-on-error: true

    - name: Build Debug APK (fallback)
      if: failure()
      run: ./gradlew assembleDebug
      continue-on-error: true

    - name: Find APK files
      id: find_apk
      run: |
        if [ -f "TMessagesProj/build/outputs/apk/release/TMessagesProj-release-unsigned.apk" ]; then
          echo "apk_path=TMessagesProj/build/outputs/apk/release/TMessagesProj-release-unsigned.apk" >> $GITHUB_OUTPUT
          echo "apk_name=Nekogram-release-unsigned.apk" >> $GITHUB_OUTPUT
        elif [ -f "TMessagesProj/build/outputs/apk/debug/TMessagesProj-debug.apk" ]; then
          echo "apk_path=TMessagesProj/build/outputs/apk/debug/TMessagesProj-debug.apk" >> $GITHUB_OUTPUT
          echo "apk_name=Nekogram-debug.apk" >> $GITHUB_OUTPUT
        else
          echo "apk_path=" >> $GITHUB_OUTPUT
          echo "apk_name=" >> $GITHUB_OUTPUT
        fi

    - name: Upload APK to release
      if: steps.find_apk.outputs.apk_path != ''
      uses: actions/upload-artifact@v3
      with:
        name: ${{ steps.find_apk.outputs.apk_name }}
        path: ${{ steps.find_apk.outputs.apk_path }}
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/') && steps.find_apk.outputs.apk_path != ''
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ steps.find_apk.outputs.apk_path }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Log Summary
      if: always()
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "- Branch: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
        echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
