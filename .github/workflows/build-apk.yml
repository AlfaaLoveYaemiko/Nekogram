name: Build APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Make Gradle executable
      run: chmod +x ./gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease
      continue-on-error: true

    - name: Build Debug APK (fallback)
      if: failure()
      run: ./gradlew assembleDebug
      continue-on-error: true

    - name: Find APK files
      id: find_apk
      run: |
        if [ -f "TMessagesProj/build/outputs/apk/release/TMessagesProj-release-unsigned.apk" ]; then
          echo "apk_path=TMessagesProj/build/outputs/apk/release/TMessagesProj-release-unsigned.apk" >> $GITHUB_OUTPUT
          echo "apk_name=Nekogram-release-unsigned.apk" >> $GITHUB_OUTPUT
          echo "build_type=release" >> $GITHUB_OUTPUT
        elif [ -f "TMessagesProj/build/outputs/apk/debug/TMessagesProj-debug.apk" ]; then
          echo "apk_path=TMessagesProj/build/outputs/apk/debug/TMessagesProj-debug.apk" >> $GITHUB_OUTPUT
          echo "apk_name=Nekogram-debug.apk" >> $GITHUB_OUTPUT
          echo "build_type=debug" >> $GITHUB_OUTPUT
        else
          echo "apk_path=" >> $GITHUB_OUTPUT
          echo "apk_name=" >> $GITHUB_OUTPUT
          echo "build_type=" >> $GITHUB_OUTPUT
        fi

    - name: Upload APK Artifacts
      if: steps.find_apk.outputs.apk_path != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.find_apk.outputs.apk_name }}
        path: ${{ steps.find_apk.outputs.apk_path }}
        retention-days: 30
        if-no-files-found: warn
        compression-level: 0

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/') && steps.find_apk.outputs.apk_path != ''
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ steps.find_apk.outputs.apk_path }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Failure Notification
      if: failure() && steps.find_apk.outputs.apk_path == ''
      run: |
        echo "❌ Build failed - No APK generated"
        exit 1

    - name: Build Success Summary
      if: always() && steps.find_apk.outputs.apk_path != ''
      run: |
        echo "## ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Type:** ${{ steps.find_apk.outputs.build_type }}" >> $GITHUB_STEP_SUMMARY
        echo "- **APK:** ${{ steps.find_apk.outputs.apk_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Actor:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
