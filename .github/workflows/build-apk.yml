name: Build APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Make Gradle executable
      run: chmod +x ./gradlew

    - name: Create minimal google-services.json
      run: |
        mkdir -p TMessagesProj_App
        cat > TMessagesProj_App/google-services.json << 'EOF'
        {
          "type": "service_account",
          "project_id": "nekogram-local",
          "private_key_id": "key-id",
          "private_key": "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA2a2rwplg8HhUXiMCLy0/2dKM6nJMb4K1xPt7wgH+3PnzFz9o\n-----END RSA PRIVATE KEY-----\n",
          "client_email": "firebase-adminsdk@nekogram-local.iam.gserviceaccount.com",
          "client_id": "123456789",
          "auth_uri": "https://accounts.google.com/o/oauth2/auth",
          "token_uri": "https://oauth2.googleapis.com/token",
          "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
          "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/firebase-adminsdk%40nekogram-local.iam.gserviceaccount.com"
        }
        EOF

    - name: Build Debug APK
      run: ./gradlew assembleDebug
      continue-on-error: true

    - name: Find APK files
      id: find_apk
      run: |
        if [ -f "TMessagesProj_App/build/outputs/apk/debug/TMessagesProj_App-debug.apk" ]; then
          echo "apk_path=TMessagesProj_App/build/outputs/apk/debug/TMessagesProj_App-debug.apk" >> $GITHUB_OUTPUT
          echo "apk_name=Nekogram-debug-$(date +%Y%m%d-%H%M%S).apk" >> $GITHUB_OUTPUT
          echo "build_type=debug" >> $GITHUB_OUTPUT
        elif [ -f "TMessagesProj/build/outputs/apk/debug/TMessagesProj-debug.apk" ]; then
          echo "apk_path=TMessagesProj/build/outputs/apk/debug/TMessagesProj-debug.apk" >> $GITHUB_OUTPUT
          echo "apk_name=Nekogram-debug-$(date +%Y%m%d-%H%M%S).apk" >> $GITHUB_OUTPUT
          echo "build_type=debug" >> $GITHUB_OUTPUT
        else
          echo "apk_path=" >> $GITHUB_OUTPUT
          echo "apk_name=" >> $GITHUB_OUTPUT
          echo "build_type=" >> $GITHUB_OUTPUT
        fi

    - name: Upload APK Artifacts
      if: steps.find_apk.outputs.apk_path != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.find_apk.outputs.apk_name }}
        path: ${{ steps.find_apk.outputs.apk_path }}
        retention-days: 30
        if-no-files-found: warn
        compression-level: 0

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/') && steps.find_apk.outputs.apk_path != ''
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ steps.find_apk.outputs.apk_path }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Success Summary
      if: success() && steps.find_apk.outputs.apk_path != ''
      run: |
        echo "## ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Type:** ${{ steps.find_apk.outputs.build_type }}" >> $GITHUB_STEP_SUMMARY
        echo "- **APK:** ${{ steps.find_apk.outputs.apk_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Actor:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

    - name: Build Failure Summary
      if: failure() || steps.find_apk.outputs.apk_path == ''
      run: |
        echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "Check the logs above for details." >> $GITHUB_STEP_SUMMARY
